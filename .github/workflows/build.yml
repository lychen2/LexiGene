name: Verify and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: TypeScript, Go, and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node tools/run-go.mjs test -mod=readonly ./...
      - run: node tools/run-go.mjs vet ./...
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence
          path: |
            artifacts/*.png
            test-results/
          retention-days: 7

  build:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - os: macos-latest
            platform: darwin/universal
            artifact: darwin-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Build native application and installer
        run: npm run build -- -platform ${{ matrix.platform }}
      - name: Archive macOS bundle with permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/darwin-universal/LexiGene.app build/darwin-universal/LexiGene-macos-universal.zip
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LexiGene-${{ matrix.artifact }}
          path: |
            build/${{ matrix.artifact }}/*.deb
            build/${{ matrix.artifact }}/*.tar.gz
            build/${{ matrix.artifact }}/*.exe
            build/${{ matrix.artifact }}/*.dmg
            build/${{ matrix.artifact }}/*.zip
            build/${{ matrix.artifact }}/*OFL*
            build/${{ matrix.artifact }}/LICENSE
          if-no-files-found: error
          retention-days: 14

  android:
    name: Package Android APK
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Android build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - run: npm ci
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/artifacts/android/lexigene-release.jks
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "Signing with the configured release key."; else echo "No release key configured; signing with a generated key."; fi
          npm run build:android
      - name: Inspect the built package
        run: |
          grep -q 'package: name=.dev.lexigene.app' <("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging build/android/LexiGene-android.apk)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/android/LexiGene-android.apk
          unzip -l build/android/LexiGene-android.apk | grep -E 'classes.dex|lib/arm64-v8a/liblexigene.so|lib/x86_64/liblexigene.so|assets/www/index.html'
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LexiGene-android
          path: build/android/LexiGene-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: LexiGene-*
          path: packages
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' files < <(find packages -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.apk' \) -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes --title "LexiGene $RELEASE_TAG"